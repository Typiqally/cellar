name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Swift 6 toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcrun swift --version
      - name: Test with coverage
        run: Scripts/check-coverage.sh
      - name: Build universal release executable
        run: xcrun swift build -c release --arch arm64 --arch x86_64
      - name: Verify universal executable
        run: |
          file .build/apple/Products/Release/cellar
          lipo .build/apple/Products/Release/cellar -verify_arch arm64 x86_64
          test "$(stat -f %z .build/apple/Products/Release/cellar)" -lt 5242880
